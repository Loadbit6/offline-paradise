<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Your Site Title</title>
  <style>
    #loginScreen {
      position: fixed;
      inset: 0;
      background: #111;
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    body.locked *:not(#loginScreen) {
      display: none !important;
    }
  </style>
</head>
<body class="locked">

  <!-- 🔐 LOGIN GATE -->
  <div id="loginScreen">
    <h2>Login</h2>
    <input id="username" type="text" placeholder="Username"><br>
    <input id="password" type="password" placeholder="Password"><br>
    <button id="loginBtn">Login</button>
    <p id="loginStatus"></p>
  </div>

  <!-- ⬇️⬇️ PASTE YOUR ENTIRE SITE BELOW THIS LINE ⬇️⬇️ -->
  <div id="mainContent">
    <!-- Example placeholder content -->
    <!-- 🟡 REPLACE THIS WITH YOUR FULL ORIGINAL INDEX.HTML BODY CONTENT -->
    <h1>Welcome to my site!</h1>
    <p>This is the actual content that should load after login.</p>
    <!-- 🟡 Your scripts, styles, images, everything goes here -->
  </div>
  <!-- ⬆️⬆️ END OF WHERE TO PASTE ⬆️⬆️ -->

  <script src="auth.js"></script>
</body>
</html>
